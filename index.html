{id:'vocab',title:'Vocabulary Explorer',icon:'🧭',level:'A1',minutes:5,xp:60,category:'Vocabulary',desc:'Descubre palabras útiles para la escuela, la ciudad y tu rutina.',goal:'Reconocer vocabulario cotidiano.',questions:[
{q:'Choose the correct meaning of “library”.',opts:['A place to borrow books','A place to buy medicine','A place to play football'],a:0,why:'A library is a place where people can read or borrow books.'},
{q:'Complete: I have breakfast in the ____.',opts:['morning','midnight','yesterday'],a:0,why:'We usually have breakfast in the morning.'},
{q:'Which word means “rápido”?',opts:['Slow','Fast','Quiet'],a:1,why:'Fast means rápido; slow means lento.'},
{q:'Choose the opposite of “expensive”.',opts:['Cheap','Large','Busy'],a:0,why:'Cheap means inexpensive or de bajo precio.'}]},
{id:'grammar',title:'Grammar Challenge',icon:'🧩',level:'A1–A2',minutes:7,xp:75,category:'Grammar',desc:'Domina estructuras clave y supera desafíos gramaticales.',goal:'Usar presente simple, continuo y pasado simple.',questions:[
{q:'He ____ to school every day.',opts:['go','goes','going'],a:1,why:'With he, she or it, the present simple verb usually takes -s/-es.'},
{q:'Look! They ____ football now.',opts:['play','plays','are playing'],a:2,why:'Use am/is/are + verb-ing for actions happening now.'},
{q:'Yesterday, we ____ a movie.',opts:['watch','watched','watching'],a:1,why:'For regular verbs, the simple past usually ends in -ed.'},
{q:'____ she like music?',opts:['Do','Does','Is'],a:1,why:'Use does for present simple questions with he, she or it.'},
{q:'I ____ not understand this question.',opts:['do','does','am'],a:0,why:'Use do not (don’t) with I/you/we/they in the present simple.'}]},
{id:'daily',title:'Daily Conversations',icon:'💬',level:'A1',minutes:6,xp:60,category:'Communication',desc:'Practica saludos, presentaciones y conversaciones cotidianas.',goal:'Responder con expresiones naturales.',questions:[
{q:'Someone says “How are you?” Choose a natural answer.',opts:['I am fine, thank you.','I am 16 years.','I have fine.'],a:0,why:'“I’m fine, thank you” is a common response to “How are you?”'},
{q:'Complete: “Nice to ____ you.”',opts:['meet','meeting','met'],a:0,why:'The expression is “Nice to meet you.”'},
{q:'You want to ask for help politely.',opts:['Help me now!','Could you help me, please?','You helping me?'],a:1,why:'“Could you… please?” is a polite request.'},
{q:'Choose the best reply: “Would you like some water?”',opts:['Yes, please.','I am water.','Yes, I like.'],a:0,why:'“Yes, please” is a natural polite acceptance.'}]},
{id:'listening',title:'Listening Practice',icon:'🎧',level:'A1–A2',minutes:5,xp:60,category:'Listening',desc:'Lee un guion breve como si fuera un audio y comprueba lo que entendiste.',goal:'Identificar información específica en un mensaje oral simulado.',questions:[
{q:'Listening script: “Hi, I’m Mia. I’m fifteen and I live in Cuenca.” How old is Mia?',opts:['Thirteen','Fifteen','Fifty'],a:1,why:'Mia says: “I’m fifteen.” This is a text-based listening simulation, not an audio recording.'},
{q:'Script: “The train leaves at eight thirty.” What time does it leave?',opts:['8:13','8:30','3:08'],a:1,why:'Eight thirty means 8:30.'},
{q:'Script: “Tom usually walks to school, but today he is taking the bus.” How is Tom going today?',opts:['On foot','By bus','By train'],a:1,why:'The phrase “today he is taking the bus” gives the answer.'}]},
{id:'reading',title:'Reading Adventure',icon:'📚',level:'A1–A2',minutes:7,xp:75,category:'Reading',desc:'Lee textos cortos y encuentra información importante.',goal:'Comprender ideas principales y detalles.',passage:'Emma is a 16-year-old student. She gets up at 6:30 and walks to school with her brother. She likes science and English. After school, she does her homework and plays volleyball twice a week.',questions:[
{q:'How old is Emma?',opts:['15','16','17'],a:1,why:'The text says Emma is 16 years old.'},
{q:'How does she go to school?',opts:['By car','By bus','On foot'],a:2,why:'She walks to school with her brother.'},
{q:'What does Emma do after school?',opts:['She does homework and plays volleyball.','She goes to the cinema every day.','She sleeps until dinner.'],a:0,why:'The final sentence gives both activities.'},
{q:'Which subject does she like?',opts:['History only','Science and English','Art and music'],a:1,why:'The text says she likes science and English.'}]},
{id:'writing',title:'Writing Mission',icon:'✍️',level:'A1–A2',minutes:8,xp:60,category:'Writing',desc:'Construye oraciones correctas y escribe sobre tu vida.',goal:'Producir oraciones sencillas y comprensibles.',questions:[
{q:'Choose the correctly written sentence.',opts:['She live in Quito.','She lives in Quito.','She living in Quito.'],a:1,why:'Use lives with she in the present simple.'},
{q:'Choose the best sentence about yesterday.',opts:['Yesterday I visit my aunt.','Yesterday I visited my aunt.','Yesterday I visiting my aunt.'],a:1,why:'Visited is the simple past of visit.'},
{q:'Put the words in the correct order: “always / I / breakfast / eat”.',opts:['Always eat I breakfast.','I always eat breakfast.','I breakfast eat always.'],a:1,why:'Frequency adverbs usually go before the main verb: I always eat breakfast.'}]},
{id:'speaking',title:'Speaking Challenge',icon:'🎙️',level:'A1–A2',minutes:6,xp:60,category:'Speaking',desc:'Ensaya respuestas para presentarte y hablar de tus preferencias.',goal:'Expresar información personal con frases básicas.',questions:[
{q:'Choose the best self-introduction.',opts:['I name Ana.','My name is Ana, and I’m sixteen.','Me Ana sixteen.'],a:1,why:'“My name is…” and “I’m…” are correct ways to introduce yourself.'},
{q:'Complete: “In my free time, I enjoy ____ music.”',opts:['listen','listening to','listened'],a:1,why:'Enjoy is followed by a gerund (-ing); we say “listen to music”.'},
{q:'You did not understand. What can you say?',opts:['Repeat now.','Could you repeat that, please?','What you said?'],a:1,why:'“Could you repeat that, please?” is a polite request.'}]},
{id:'final',title:'Final Guardian Test',icon:'🛡️',level:'A1–A2',minutes:10,xp:100,category:'Mixed skills',desc:'Combina vocabulario, gramática, lectura y comunicación en el reto final.',goal:'Demostrar comprensión integrada de contenidos A1–A2.',questions:[
{q:'My sister ____ TV every evening.',opts:['watch','watches','watching'],a:1,why:'With she/he/it, add -es to watch.'},

{q:'What is the past of “go”?',opts:['Goed','Went','Gone yesterday'],a:1,why:'The simple past of go is went.'},

{q:'Choose the correct sentence.',opts:['She can speaks English.','She can speak English.','She can to speak English.'],a:1,why:'Modal verbs such as can are followed by the base form of the verb.'}]}

if(/present simple|presente simple|daily routine|rutina/.test(s))return `¡Vamos a practicar el presente simple! ⏰\n\nUsamos el present simple para hábitos y rutinas.\n• I/You/We/They + base verb: “They study English.”\n• He/She/It + verb-s/-es: “She studies English.”\n• Preguntas: Do you study? / Does she study?\n\nMini reto: completa “My brother ____ (watch) TV every evening.” Escribe tu respuesta.`;
if(/greeting|saludo|hello|hi\b/.test(s))return `Great! 👋 Let's practice greetings.\n\nA: “Hi! How are you?”\nB: “I'm fine, thank you. How about you?”\nA: “I'm great!”\n\nEn español: “How are you?” significa “¿Cómo estás?”. Puedes responder “I'm fine”, “I'm good” o “I'm great”.\n\nYour turn: How are you today?`;
if(/vocabulary|vocabulario|quiz/.test(s))return `📘 Quick vocabulary challenge!\n\nWhat does “usually” mean?\nA) Nunca\nB) Usualmente / normalmente\nC) Rápidamente\n\nEscribe A, B o C y te daré retroalimentación.`;
if(/^a$|^b$|^c$/.test(s.trim()))return s.trim()==='b'?`¡Correcto! 🎉 “Usually” significa “usualmente” o “normalmente”. Ejemplo: “I usually walk to school.”\n\nPrueba una oración: escribe algo que you usually do.`:`Casi. La respuesta correcta es B: “usually” significa “usualmente / normalmente”.\n\nEjemplo: “I usually do my homework after school.” ¿Qué haces tú usually after school?`;
if(/correct|correg|error|grammar|gramática/.test(s))return `¡Claro! Puedo ayudarte con errores comunes de A1–A2. Por ejemplo:\n\n❌ “She don't like tea.”\n✅ “She doesn't like tea.”\n\nExplicación: con he/she/it usamos doesn't + verbo base en negativas del presente simple.\n\nEscribe una oración en inglés y revisaré algunos patrones frecuentes. Esta versión utiliza reglas y respuestas predefinidas; no comprende todos los casos como lo haría un modelo de IA conectado.`;
if(/past simple|pasado|yesterday/.test(s))return `Let's practice the simple past! 🕰️\n\nUsamos el pasado simple para acciones terminadas en el pasado.\n• Regular: play → played; visit → visited.\n• Irregular: go → went; eat → ate; have → had.\n\nExample: “Yesterday, I went to school.”\n\nMini reto: completa “Last weekend, we ____ (play) basketball.”`;
return `¡Gracias por tu mensaje! 😊 Vamos a practicar paso a paso.\n\nPuedes pedirme ayuda con present simple, past simple, greetings o vocabulary. También puedes escribir una oración breve en inglés para revisar algunos errores frecuentes.\n\nTry answering this question in English: “What do you usually do after school?”\n\nNota: estás usando el modo de práctica local con respuestas predefinidas, no una IA conectada.`;
}
function renderProgress(){page='progress';let u=getUser(),p=u.progress,results=p.results.slice().reverse(),max=Math.max(100,...results.map(r=>r.percent));let cats={};for(const r of p.results){let m=missions.find(x=>x.id===r.id);if(m){cats[m.category]??=[];cats[m.category].push(r.percent)}}shell(`<div class="page-title"><div><div class="eyebrow">Tu evolución</div><h1>Mi progreso</h1><p>Indicadores calculados a partir de tus intentos registrados en este navegador.</p></div><span class="pill">⚡ ${p.xp} XP acumulados</span></div><div class="grid grid-3"><div class="card stat"><div><div class="label">Promedio de resultados</div><div class="num">${p.results.length?Math.round(p.results.reduce((a,r)=>a+r.percent,0)/p.results.length):0}%</div><div class="small muted">${p.results.length} intentos registrados</div></div><div class="iconbox">📈</div></div><div class="card stat"><div><div class="label">Misiones superadas</div><div class="num">${p.completed.length}/${missions.length}</div><div class="small muted">Al menos un resultado ≥70%</div></div><div class="iconbox">🏁</div></div><div class="card stat"><div><div class="label">Conversaciones iniciadas</div><div class="num">${p.chatSessions.length}</div><div class="small muted">Mensajes enviados al tutor</div></div><div class="iconbox">💬</div></div></div><div class="grid grid-2" style="margin-top:18px"><div class="card"><div class="section-head" style="margin-top:0"><h3>Resultados recientes</h3></div>${results.length?`<div class="chart">${results.slice(-8).map((r,i)=>`<div class="bar-wrap"><b>${r.percent}%</b><div class="bar" style="height:${Math.max(5,r.percent)}%"></div><small>${esc(r.title.split(' ')[0])}</small></div>`).join('')}</div>`:'<div class="empty">Completa una misión para generar tu gráfico.</div>'}</div><div class="card"><div class="section-head" style="margin-top:0"><h3>Dominio por categoría</h3></div>${Object.keys(cats).length?Object.entries(cats).map(([c,vals])=>{let avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);return `<div style="margin:17px 0"><div style="display:flex;justify-content:space-between;margin-bottom:7px"><b>${esc(c)}</b><span class="small muted">${avg}%</span></div><div class="progress"><span style="width:${avg}%"></span></div></div>`}).join(''):'<div class="empty">Aún no hay datos suficientes por categoría.</div>'}<div class="notice">Las recomendaciones aparecen cuando hay resultados registrados. Un porcentaje bajo sugiere repetir la misión y revisar las explicaciones.</div></div></div><div class="section-head"><h3>Historial de evaluaciones</h3></div><div class="card">${p.results.length?`<div class="table-wrap"><table><thead><tr><th>Misión</th><th>Resultado</th><th>Aciertos</th><th>XP</th><th>Fecha</th></tr></thead><tbody>${p.results.map(r=>`<tr><td>${esc(r.title)}</td><td><span class="tag ${r.percent>=70?'done':''}">${r.percent}%</span></td><td>${r.correct}/${r.total}</td><td>+${r.xp}</td><td>${new Date(r.at).toLocaleString('es-EC')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tu historial aparecerá aquí cuando termines tu primera evaluación.</div>'}</div><div class="section-head"><h3>Registro de experiencia</h3></div><div class="card">${p.history.length?`<div class="table-wrap"><table><thead><tr><th>Motivo</th><th>XP</th><th>Fecha</th></tr></thead><tbody>${p.history.map(h=>`<tr><td>${esc(h.reason)}</td><td>+${h.amount}</td><td>${new Date(h.at).toLocaleString('es-EC')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no has ganado XP.</div>'}</div>`)}
function renderBadges(){page='badges';let p=getUser().progress;shell(`<div class="page-title"><div><div class="eyebrow">Logros de la academia</div><h1>Mis medallas</h1><p>Las medallas se desbloquean al cumplir condiciones de aprendizaje y constancia.</p></div><span class="pill">🏅 ${p.badges.length}/${badgeDefs.length}</span></div><div class="card"><div class="progress"><span style="width:${p.badges.length/badgeDefs.length*100}%"></span></div><p class="small muted">${p.badges.length} de ${badgeDefs.length} logros desbloqueados</p><div class="badge-grid" style="margin-top:22px">${badgeDefs.map(b=>`<div class="badge ${p.badges.includes(b.id)?'unlocked':''}"><div class="medal">${b.icon}</div><b>${esc(b.name)}</b><small>${esc(b.desc)}</small><div style="margin-top:9px"><span class="tag ${p.badges.includes(b.id)?'done':''}">${p.badges.includes(b.id)?'Desbloqueada':'Bloqueada'}</span></div></div>`).join('')}</div></div>`)}
function renderAdmin(){page='admin';let users=db.users.filter(u=>u.role==='student'),allResults=users.flatMap(u=>u.progress.results.map(r=>({...r,user:u.name,email:u.email}))),completed=users.reduce((a,u)=>a+u.progress.completed.length,0),avg=allResults.length?Math.round(allResults.reduce((a,r)=>a+r.percent,0)/allResults.length):0;shell(`<div class="page-title"><div><div class="eyebrow">Control de la academia</div><h1>Resumen administrativo</h1><p>Datos locales de demostración almacenados en este navegador.</p></div><span class="pill">🛡️ Acceso administrador</span></div><div class="grid grid-4"><div class="card stat"><div><div class="label">Estudiantes</div><div class="num">${users.length}</div></div><div class="iconbox">♙</div></div><div class="card stat"><div><div class="label">Intentos de evaluación</div><div class="num">${allResults.length}</div></div><div class="iconbox">📝</div></div><div class="card stat"><div><div class="label">Promedio global</div><div class="num">${avg}%</div></div><div class="iconbox">📈</div></div><div class="card stat"><div><div class="label">Misiones completadas</div><div class="num">${completed}</div></div><div class="iconbox">🏁</div></div></div><div class="admin-tabs" style="margin-top:25px"><button class="${adminTab==='students'?'active':''}" data-admin-tab="students">Estudiantes</button><button class="${adminTab==='manage'?'active':''}" data-admin-tab="manage">Misiones y preguntas</button><button class="${adminTab==='reports'?'active':''}" data-admin-tab="reports">Resultados y actividad</button></div><div id="admin-content">${adminTab==='students'?adminStudents(users):adminTab==='manage'?adminManage():adminReports(allResults)}</div><div class="notice" style="margin-top:20px">Importante: este panel está protegido solo por controles de interfaz en esta versión local. No debe utilizarse con datos reales ni publicarse sin autenticación y autorización del lado del servidor.</div>`)}
function adminStudents(users){return `<div class="card"><div class="section-head" style="margin-top:0"><h3>Estudiantes registrados</h3><button class="btn softbtn" data-action="export-csv">Exportar CSV</button></div>${users.length?`<div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Correo</th><th>XP</th><th>Misiones</th><th>Última actividad</th><th>Acción</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${u.progress.xp}</td><td>${u.progress.completed.length}/${missions.length}</td><td>${u.progress.lastActive||'Sin actividad'}</td><td><button class="btn softbtn" style="padding:7px 10px" data-action="view-student" data-id="${u.id}">Ver progreso</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay estudiantes. Crea una cuenta desde la página de inicio.</div>'}</div>`}
function adminManage(){return `<div class="card"><div class="section-head" style="margin-top:0"><h3>Catálogo de misiones</h3><span class="tag">8 misiones iniciales</span></div><p class="small muted">Puedes editar el nombre y la descripción de las misiones en este modo local. Las preguntas base permanecen disponibles.</p><div class="table-wrap"><table><thead><tr><th>Misión</th><th>Nivel</th><th>Preguntas</th><th>XP máximo</th><th>Acción</th></tr></thead><tbody>${db.missions.map(m=>`<tr><td>${m.icon} ${esc(m.title)}</td><td>${esc(m.level)}</td><td>${m.questions.length}</td><td>${m.xp}</td><td><button class="btn softbtn" style="padding:7px 10px" data-action="edit-mission" data-id="${m.id}">Editar</button></td></tr>`).join('')}</tbody></table></div><div style="margin-top:18px"><button class="btn dangerbtn" data-action="reset-missions">Restaurar catálogo original</button></div></div>`}
function adminReports(allResults){let acts=db.activity.slice(0,40);return `<div class="card"><div class="section-head" style="margin-top:0"><h3>Resultados de evaluaciones</h3><button class="btn softbtn" data-action="export-results">Exportar resultados CSV</button></div>${allResults.length?`<div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Misión</th><th>Resultado</th><th>Fecha</th></tr></thead><tbody>${allResults.sort((a,b)=>b.at.localeCompare(a.at)).map(r=>`<tr><td>${esc(r.user)}</td><td>${esc(r.title)}</td><td><span class="tag ${r.percent>=70?'done':''}">${r.percent}%</span></td><td>${new Date(r.at).toLocaleString('es-EC')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no se han registrado evaluaciones.</div>'}<div class="section-head"><h3>Actividad reciente</h3></div>${acts.length?`<div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Evento</th><th>Fecha</th></tr></thead><tbody>${acts.map(a=>{let u=db.users.find(x=>x.id===a.userId);return `<tr><td>${esc(u?.name||'Usuario eliminado')}</td><td>${esc(a.label)}</td><td>${new Date(a.at).toLocaleString('es-EC')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay actividad registrada.</div>'}</div>`}
function adminSub(tab){adminTab=tab;renderAdmin()}
function renderAdminContent(){let users=db.users.filter(u=>u.role==='student'),allResults=users.flatMap(u=>u.progress.results.map(r=>({...r,user:u.name,email:u.email})));$('#admin-content').innerHTML=adminTab==='students'?adminStudents(users):adminTab==='manage'?adminManage():adminReports(allResults)}
function viewStudent(id){let u=db.users.find(x=>x.id===id);if(!u)return;$('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="student-modal-title"><div class="modal-head"><div><div class="eyebrow">Ficha de progreso</div><h2 id="student-modal-title">${esc(u.name)}</h2><p class="muted">${esc(u.email)}</p></div><button class="close" data-action="close-modal" aria-label="Cerrar">×</button></div><div class="grid grid-3"><div class="card"><div class="label">XP</div><div class="num">${u.progress.xp}</div></div><div class="card"><div class="label">Misiones</div><div class="num">${u.progress.completed.length}</div></div><div class="card"><div class="label">Racha</div><div class="num">${u.progress.streak}</div></div></div><h3>Resultados</h3>${u.progress.results.length?`<div class="table-wrap"><table><thead><tr><th>Misión</th><th>Resultado</th><th>Fecha</th></tr></thead><tbody>${u.progress.results.map(r=>`<tr><td>${esc(r.title)}</td><td>${r.percent}%</td><td>${new Date(r.at).toLocaleDateString('es-EC')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Sin evaluaciones registradas.</p>'}</div></div>`}
function editMission(id){let m=db.missions.find(x=>x.id===id);if(!m)return;$('#modal-root').innerHTML=`<div class="modal-backdrop"><form class="modal" id="edit-mission-form"><div class="modal-head"><div><div class="eyebrow">Administración</div><h2>Editar misión</h2></div><button type="button" class="close" data-action="close-modal">×</button></div><div class="field"><label>Nombre de misión</label><input name="title" value="${esc(m.title)}" required maxlength="80"></div><div class="field"><label>Descripción</label><textarea name="desc" rows="3" required maxlength="400">${esc(m.desc)}</textarea></div><div class="field"><label>Objetivo de aprendizaje</label><input name="goal" value="${esc(m.goal||'')}" maxlength="200"></div><div class="field"><label>XP máximo</label><input name="xp" type="number" min="15" max="300" value="${m.xp}" required></div><button class="btn primary full">Guardar cambios</button></form></div>`;$('#edit-mission-form').addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target);m.title=String(fd.get('title')).trim();m.desc=String(fd.get('desc')).trim();m.goal=String(fd.get('goal')).trim();m.xp=Math.max(15,Math.min(300,Number(fd.get('xp'))));saveDB();$('#modal-root').innerHTML='';renderAdminContent();toast('Misión actualizada.','good')})}
function exportCSV(rows,filename){let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast('Archivo CSV preparado.','good')}
function logout(){current=null;activeMission=null;chatHistory=[];home()}
function route(p){if(!getUser()){auth('login');return}if(getUser().role==='admin'){if(['admin','students','manage','reports'].includes(p)){page='admin';adminTab=p==='manage'?'manage':p==='reports'?'reports':'students';renderAdmin();return}toast('Esta sección es solo para estudiantes.','bad');return}if(['admin','students','manage','reports'].includes(p)){toast('No tienes permisos para acceder a administración.','bad');return}if(p==='dashboard')renderDashboard();else if(p==='missions')renderMissions();else if(p==='chat')renderChat();else if(p==='progress')renderProgress();else if(p==='badges')renderBadges();else renderDashboard()}
document.addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go){auth(go.dataset.go);return}let pageBtn=e.target.closest('[data-page]');if(pageBtn){route(pageBtn.dataset.page);$('#sidebar')?.classList.remove('open');return}let ab=e.target.closest('[data-admin-tab]');if(ab){adminSub(ab.dataset.adminTab);return}let a=e.target.closest('[data-action]');if(!a)return;let act=a.dataset.action;if(act==='logout')logout();if(act==='menu')$('#sidebar')?.classList.toggle('open');if(act==='start-mission')openMission(a.dataset.id);if(act==='answer'&&!quizSubmitted){quizAnswers[Number(a.dataset.q)]=Number(a.dataset.a);renderQuiz()}if(act==='retry-quiz'){quizAnswers={};quizSubmitted=false;renderQuiz()}if(act==='new-chat'){chatHistory=[];renderChat()}if(act==='chat-prompt')sendChat(a.dataset.text);if(act==='view-student')viewStudent(a.dataset.id);if(act==='edit-mission')editMission(a.dataset.id);if(act==='close-modal'){if(e.target.classList.contains('modal-backdrop')&&e.target!==a)return;$('#modal-root').innerHTML=''}if(act==='reset-missions'){if(confirm('¿Restaurar el catálogo original de misiones? Se perderán los cambios de nombres y descripciones.')){db.missions=JSON.parse(JSON.stringify(missions));saveDB();renderAdminContent();toast('Catálogo restaurado.')}}if(act==='export-csv'){let users=db.users.filter(u=>u.role==='student');exportCSV([['Nombre','Correo','XP','Misiones completadas','Racha','Última actividad'],...users.map(u=>[u.name,u.email,u.progress.xp,u.progress.completed.length,u.progress.streak,u.progress.lastActive])],'english-quest-estudiantes.csv')}if(act==='export-results'){let users=db.users.filter(u=>u.role==='student');exportCSV([['Estudiante','Correo','Misión','Porcentaje','Aciertos','Total','Fecha'],...users.flatMap(u=>u.progress.results.map(r=>[u.name,u.email,r.title,r.percent,r.correct,r.total,r.at]))],'english-quest-resultados.csv')}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop')&&e.target.id!=='edit-mission-form'){$('#modal-root').innerHTML=''}});
function init(){loadDB();home()}
init();
})();

  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
